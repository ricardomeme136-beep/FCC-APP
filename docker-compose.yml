# Local development infrastructure only — just MongoDB.
#
# The backend runs natively on Windows (venv + uvicorn), not in Docker, so it's
# easy to iterate on with --reload. Only MongoDB is containerized here because
# there's no local MongoDB install on this machine.
#
# Start:  docker compose up -d
# Stop:   docker compose down            (data persists in the named volume)
# Wipe:   docker compose down -v         (deletes the volume — data loss)

services:
  mongo:
    image: mongo:7
    container_name: wasteflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - wasteflow_mongo_data:/data/db

volumes:
  wasteflow_mongo_data:
